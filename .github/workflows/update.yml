name: 更新优选

on:
  schedule:
    - cron: '7,22,37,52 22-23 * * *'
    - cron: '7,22,37,52 0-13 * * *'
    - cron: '4,34 14-21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  update-and-deploy:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huaweicloudsdkcore huaweicloudsdkiam huaweicloudsdkdns

      - name: Run huawei_cf_pick.py
        env:
          HUAWEICLOUD_SDK_AK: ${{ secrets.HUAWEICLOUD_SDK_AK }}
          HUAWEICLOUD_SDK_SK: ${{ secrets.HUAWEICLOUD_SDK_SK }}
        run: python huawei_cf_pick.py update --online
